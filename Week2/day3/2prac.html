<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 500px;
            height: 500px;
            border: 1px solid black;
            position: relative;
        }
        .child{
            width: 100px;
            height: 100px;
            background-color: teal;
            position: absolute;
            right: 0;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
    <h1 style="background-color: yellow; display: inline;">My name is Rohit</h1>
    <span style="background-color: blue; display: block;">My name is Rohit</span>
</body>
</html>
